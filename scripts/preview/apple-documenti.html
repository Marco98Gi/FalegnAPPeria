<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --sep: rgba(60,60,67,0.29);
    --label: #1C1C1E; --label2: #8E8E93; --accent: #B4652E; --accent-soft: rgba(180,101,46,0.12);
    --warn-bg: rgba(200,138,46,0.15); --warn-ink: #8A5A12;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  .phone { width: 390px; height: 844px; background: var(--bg); color: var(--label); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .header { background: var(--bg); padding: 10px 8px 8px 8px; }
  .header-row { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
  .back { color: var(--accent); display: flex; align-items: center; gap: 2px; font-size: 17px; }
  .titles { flex: 1; text-align: center; margin-right: 28px; }
  .job-name { font-size: 17px; font-weight: 600; }
  .job-client { font-size: 12.5px; color: var(--label2); }
  .status-pill { align-self: center; margin: 10px auto 0 auto; padding: 4px 12px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); font-size: 12px; font-weight: 700; width: fit-content; }
  .segmented { display: flex; background: rgba(118,118,128,0.12); border-radius: 9px; padding: 2px; gap: 2px; margin: 12px 16px 0 16px; }
  .segmented div { flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; font-size: 13px; font-weight: 600; color: rgba(60,60,67,0.6); }
  .segmented div.active { background: #fff; box-shadow: 0 1px 2.5px rgba(0,0,0,0.18); color: var(--accent); }

  .scroll { flex: 1; overflow: hidden; padding: 4px 16px 0 16px; }
  .section-header { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: 0.3px; margin: 16px 4px 8px 4px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile { background: var(--card); border-radius: 14px; overflow: hidden; }
  .thumb { height: 108px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .thumb.note { flex-direction: column; gap: 4px; padding: 10px; text-align: center; }
  .note-title { font-size: 12px; font-weight: 700; color: var(--label); }
  .note-date { font-size: 10.5px; color: var(--label2); }
  .tile-name { font-size: 12.5px; font-weight: 600; padding: 8px 10px 10px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-tile { border: 1.4px dashed rgba(60,60,67,0.25); border-radius: 14px; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--label2); }
  .add-tile .circle { width: 32px; height: 32px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="header-row">
      <div class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg><span>Lavori</span></div>
      <div class="titles"><div class="job-name">Libreria soggiorno</div><div class="job-client">Sig.ra Bianchi</div></div>
    </div>
    <div class="status-pill">In lavorazione</div>
    <div class="segmented"><div>Timeline</div><div class="active">Documenti</div><div>Ore</div><div>Materiali</div></div>
  </div>
  <div class="scroll">
    <div class="section-header">File e note</div>
    <div class="grid">
      <div class="tile">
        <div class="thumb"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="tile-name">Preventivo.pdf</div>
      </div>
      <div class="tile">
        <div class="thumb" style="background:#EFE8DC;color:#9C8F80;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>
        <div class="tile-name">Foto disegno.jpg</div>
      </div>
      <div class="tile">
        <div class="thumb note">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
          <div class="note-title">Misure mobile ingresso</div>
          <div class="note-date">26 set 2026</div>
        </div>
        <div class="tile-name">Misure mobile ingresso</div>
      </div>
      <div class="add-tile">
        <div class="circle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <div style="font-size:12.5px;font-weight:600;">Aggiungi</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
